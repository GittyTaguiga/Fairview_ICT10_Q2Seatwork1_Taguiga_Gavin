<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Member Checker</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1628cd;
            text-align: center;
            font-family: "Montserrat", sans-serif;
        }

        #box {
            background-color: #6b11cc;
            color: #ffffff;
            margin: 0 auto;
            text-align: center;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 480px;
        }

        h1 {
            color: #d38a0b;
        }

        .btn:hover {
            transform:translateY(-1px);
        }

    </style>
</head>
<body>

    <div id="box">
        <h1>ICT Club Member Checker</h1>
        <p>Enter your name to check if you are a member of the ICT Club.</p>

        <form>

            <input type="text" id="nameInput1" placeholder="Enter First Name">

            <br><br>

            <input type="text" id="nameInput2" placeholder="Enter Last Name">

            <br><br>
            <button id="check_member" type="button" class="btn btn-primary">Check Membership</button>

            <p id="result"></p>
            <div id="output1"></div>
        </form>
    </div>

<script type ="py" src="main.py"></script>



</body>
</html>
